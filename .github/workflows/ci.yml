name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: propflow
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: propflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propflow -d propflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://propflow:ci-ephemeral-password@localhost:5432/propflow_test
      TEST_DATABASE_URL: postgresql+psycopg://propflow:ci-ephemeral-password@localhost:5432/propflow_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      RATELIMIT_STORAGE_URI: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Generate ephemeral secret
        run: echo "SECRET_KEY=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Type-check
        run: mypy app
      - name: Static security analysis
        run: bandit -c pyproject.toml -r app -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Notification links cover every resource type
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_notification_links.py
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high --omit=dev
      - name: Type-check and build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the full history, not just the latest commit
      # The CLI scans the checked-out history directly: no GitHub API calls, so it works
      # identically for pushes, pull requests and Dependabot's restricted tokens.
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: propflow
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: propflow_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propflow -d propflow_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      FLASK_APP: wsgi:app
      DATABASE_URL: postgresql+psycopg://propflow:ci-ephemeral-password@localhost:5432/propflow_e2e
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local # signed upload links served by the API (ADR 0017)
      LOCAL_STORAGE_DIR: /tmp/propflow-storage
      EMAIL_BACKEND: file # end-to-end tests read invitation links from these files
      EMAIL_FILE_DIR: /tmp/propflow-mail
      E2E_MAIL_DIR: /tmp/propflow-mail
      TRUSTED_PROXY_COUNT: "1" # each test is its own visitor (frontend/e2e/fixtures.ts)
      BACKGROUND_TASKS: sync
      FRONTEND_ORIGIN: http://localhost:3000
      API_ORIGIN: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral secrets
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "PROXY_SHARED_SECRET=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Install the API
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate and start the API (proxy secret enforced)
        working-directory: backend
        run: |
          flask db upgrade
          PORT=5000 nohup gunicorn -c gunicorn.conf.py wsgi:app > /tmp/api.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5000/health; do sleep 1; done'
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build the frontend
        working-directory: frontend
        run: npm run build
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            /tmp/api.log
          retention-days: 7
